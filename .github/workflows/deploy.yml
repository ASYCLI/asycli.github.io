name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"   # daily: keeps the free Supabase project awake + health check
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test pricing engine
        run: node tests/pricing.test.mjs
      - name: Build site
        run: python3 build.py
      - name: Check no secrets in the public bundle
        run: |
          if grep -rEn "sk_(live|test)_|rk_(live|test)_|whsec_|service_role|SUPABASE_SERVICE_ROLE" site/; then echo "Secret-looking value found in site/"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4

  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with: { version: latest }
      - name: Deploy Edge Function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy api --project-ref tmsahdvlctabrvqqdemn --no-verify-jwt --use-api
      - name: Skipped
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "Add the SUPABASE_ACCESS_TOKEN repository secret to enable backend deploys."

  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: curl -fsS https://tmsahdvlctabrvqqdemn.supabase.co/functions/v1/api/health
